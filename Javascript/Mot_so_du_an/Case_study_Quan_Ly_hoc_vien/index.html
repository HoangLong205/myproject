<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <img id="logo" src="img/hus_vnu/HUS_VNU.png" alt="Logo đại học khoa học tự nhiên">
    <h1 id="heading1">QUẢN LÝ HỌC VIÊN</h1>

    <div style="margin-top: 20px;">
        <input type="text" id="searchInput" placeholder="Nhập thông tin cần tìm">
        <select id="searchType">
            <option value="id">ID</option>
            <option value="name">Họ tên</option>
            <option value="class">Lớp</option>
        </select>
        <button onclick="searchStudent()">TÌM KIẾM</button>
    </div>

    <div id="studentDetail" style="margin-top: 20px;"></div>
<div>
    <table style="border: 1px solid black; width: 800px; float: right">
    <tr>
        <th style="font-size: 30px" colspan="7">DANH SÁCH HỌC VIÊN</th>
    </tr>

    <tr>
            <th>ID</th>
            <th>HỌ VÀ TÊN</th>
            <th>GIỚI TÍNH</th>
            <th>NGÀY SINH</th>
            <th>LỚP</th>
            <th>ẢNH</th>
            <th>TUỲ CHỌN</th>
    </tr>

    <tbody id="list_student">

    </tbody>
</table>
</div>
<div>
    <form onsubmit="createStudent(event)">
        <table border="1" style="width: 500px; height: 300px">
            <tr id="id1">
                <th colspan="2">THÔNG TIN HỌC VIÊN</th>
            </tr>

            <tr>
                <th>ID</th>
                <td><input type="number" id="id" required></td>
            </tr>

            <tr>
                <th>HỌ VÀ TÊN</th>
                <td><input type="text" id="fullName" required></td>
            </tr>

            <tr>
                <th>GIỚI TÍNH</th>
                <td><select id="gender" required>
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                    <option value="Khác">Khác</option>
                </select></td>
            </tr>

            <tr>
                <th>NGÀY SINH</th>
                <td><input type="date" id="birthDate" required></td>
            </tr>

            <tr>
                <th>LỚP</th>
                <td><input type="text" id="class" required></td>
            </tr>

            <tr>
                <th>ẢNH</th>
                <td><input type="text" id="img" placeholder="Nhập URL ảnh" required></td>
            </tr>

            <tr>
                <th></th>
                <td>
                    <button id="add" type="submit">ADD</button>
                    <button id="edit" type="button" onclick="updateStudent()">SAVE</button>
                </td>
            </tr>
        </table>
    </form>
</div>

<script src="js/Student.js"></script>
    <script src="js/StudentManagement.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
