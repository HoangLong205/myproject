<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tính số ngày trong tháng</title>
</head>
<body>
<div>
    <input type="number" id="input">
    <button onclick="tinhSoNgay()">Tính số ngày</button>
</div>

<h2 id="result"></h2>
<script>
    function tinhSoNgay(){
        let result = "";
        let a = parseInt(document.getElementById("input").value);
        switch (a) {
            case 1:
            case 3:
            case 5:
            case 7:
            case 8:
            case 10:
            case 12:

            result = "Tháng " + a + " có 31 ngày";
            break;

            case 4:
            case 6:
            case 9:
            case 11:
                result = "Tháng " + a + " có 30 ngày"
                break;

            case 2:
                result = "Tháng " + a + " có 28 hoặc 29 ngày";
                break;
        }

        document.getElementById("result").innerHTML = result;
    }
</script>
</body>
</html>
