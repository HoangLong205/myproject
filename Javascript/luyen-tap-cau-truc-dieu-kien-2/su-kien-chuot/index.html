<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form>
        <img id="myImg" src="https://m.media-amazon.com/images/I/61IkrxQ9p8L._AC_SL1500_.jpg" width="300px">
      <p>Click button to move the ball to right</p>
      <input type="button" onclick="moveRight()" value="Click me">
    </form>

    <script>
      let imgObj = document.getElementById('myImg');
      //khoi tao vi tri ban dau cho vat the
      function init() { //
        imgObj = document.getElementById('myImg');
        imgObj.style.position = 'relative';
        imgObj.style.left = '0px';

      }
      // hàm dịch chuyển vật thế sang phải bằng cách tăng số px bên trái vật thể
      function moveRight() {
        imgObj.style.left = parseInt(imgObj.style.left) + 10 + 'px';
      }

      window.onload = init; //goi ham init khi trinh duyet duoc tai lan dau
    </script>
</body>
</html>
