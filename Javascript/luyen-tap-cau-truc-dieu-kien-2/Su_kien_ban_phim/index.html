<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body onload="doReady()">
<img id="nobita" src="https://upload.wikimedia.org/wikipedia/vi/2/2c/Nobita.png" style="position:absolute;left:10px; top:10px;" height="200px" width="160"/>
<script>
  function upArrowPress() {
    let element = document.getElementById("nobita");
    element.style.top = parseFloat(element.style.top) - 5 + 'px';
  }

  function downArrowPress() {
    let element = document.getElementById("nobita");
    element.style.top = parseFloat(element.style.top) + 5 + 'px';
  }

  function leftArrowPress() {
    let element = document.getElementById("nobita");
    element.style.left = parseFloat(element.style.left) - 5 + 'px';
  }

  function rightArrowPress() {
    let element = document.getElementById("nobita");
    element.style.left = parseFloat(element.style.left) + 5 + 'px';
  }

  function moveSelect(evt) {
    switch (evt.keyCode) {
      case 37:
        leftArrowPress();
        break;
      case 39:
        rightArrowPress();
        break;
      case 38:
        upArrowPress();
        break;
      case  40:
        downArrowPress();
        break;
    }
  }

  function doReady() {
    window.addEventListener('keydown', moveSelect)
  }
</script>
</body>
</html>
