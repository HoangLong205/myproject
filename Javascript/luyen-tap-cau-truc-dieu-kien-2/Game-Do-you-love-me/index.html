<html>
<head>
    <title>Try it :))</title>
    <meta  charset=utf-8" />
    <script>
        function yesClick()
        {
            alert("Yes. you're absolutly right ");
        }
        function noOver()
        {
            var x = Math.round(Math.random() * window.innerWidth);
            var y = Math.round(Math.random() * window.innerHeight);
            document.getElementById('no').style.left = x + 'px';
            document.getElementById('no').style.top = y + 'px';
        }
    </script>
</head>
<body>
<h1 style="position:absolute; left:200px; top:100px;">Do you love me?</h1>
<input type="button" value=" YES " onclick="yesClick()" style="position:absolute; left:230px; top:190px;"/>
<input type="button" id="no" value=" NO " onmouseover="noOver()" style="position:absolute; left:300px; top:190px;"/>
</body>
</html>
