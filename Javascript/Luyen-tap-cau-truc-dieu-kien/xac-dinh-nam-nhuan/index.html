<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Có phải năm nhuận?</title>
</head>
<body>
<script>
  let year = parseInt(prompt("Enter year"));
  let isLeapYear = false;

  isDivisibleBy4 = year % 4 == 0;
  if (isDivisibleBy4) {
    let isDivisibleBy100 = year % 100 == 0;
    if (isDivisibleBy100) {
      let isDivisibleBy400 = year % 400 == 0;
      if (isDivisibleBy400) {
        isLeapYear = true
      }
    } else {
      isLeapYear = true
    }
  }

  if (isLeapYear) {
    alert(year + ' is leap year!');
  } else {
    alert(year + ' is NOT leap year!');
  }
</script>
</body>
</html>
