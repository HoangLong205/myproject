<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <input type="text" id="input">
    <input type="button" onclick="addValue()" value="Add value">
    <input type="button" onclick="displayValue()" value="Display">
    <div id="result"></div>
<script>
    var arr = new Array();
    var x = 0;
    function addValue() {
        arr[x] = document.getElementById("input").value;
        arr.push();
        alert("Element: " + arr[x] + ". Add at index: " + x);
        x++;

    }
    function displayValue() {
        var e = "<hr/>";
        for (var i = 0; i < arr.length; i++){
            e = e + "Element: " + i + " = " + arr[i] + "<br/>";
        }
    document.getElementById("result").innerHTML = e;
    }
</script>
<div>
    <script src="search_in_array.js"></script>
</div>
</body>
</html>
