<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <div>
    <p id="demo"></p>
    <script>
      let text = '';
      for (let i = 0; i < 5; i++) {
        text += 'the number is: ' + i + '<br>';
      }
      document.getElementById("demo").innerHTML = text;
    </script>
  </div>

  <div>
    <p id="demo2"></p>
    <script>
      let num = prompt('Enter a number');
      let sum = 0;
      for (var i = 1 ; i <= num; i++) {
        sum += i;
      }
      alert(sum);
    </script>
  </div>
</body>
</html>
