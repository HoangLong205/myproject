<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div>
  <script>
    let num = parseInt(prompt('Enter a number'));
    let total = 0;

    while (num != -1) {
      total += num;
      num = parseInt(prompt('Enter a number'));
    }

    alert(total);
  </script>
</div>

<script>
  let i = 1;
  while (i < 100) {
    //phân thân vòng lặp
    document.write("<hr width = " + i + "%>");
    i++;
  }
</script>

</body>
</html>
