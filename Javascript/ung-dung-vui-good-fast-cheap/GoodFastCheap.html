<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Good fast cheap</title>
    <style>
        .toggle {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 100px;
            height: 50px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            curson: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; /*khi tat*/
            transition: 0.5s;
            border-radius: 50px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 40px;
            width: 40px;
            left: 10px;
            bottom: 5.5px;
            background-color: white;
            transition: 0.5s;
            border-radius: 50%;
        }

        input:checked + .slider.good {
            background-color: limegreen;
        }

        input:checked + .slider.fast {
            background-color: #d61b06;
        }

        input:checked + .slider.cheap {
            background-color: aqua;
        }

        input:checked + .slider:before {
            transform: translateX(40px);
        }
    </style>
</head>
<body>
    <div class="toggle">
        <label class="switch">
            <input type="checkbox" id="good">
            <span class="slider good"></span>
        </label>
        <span class="">GOOD</span>
    </div>

    <div class="toggle">
        <label class="switch">
            <input type="checkbox" id="fast">
            <span class="slider fast"></span>
        </label>
        <span class="">FAST</span>
    </div>

    <div class="toggle">
        <label class="switch">
            <input type="checkbox" id="cheap">
            <span class="slider cheap"></span>
        </label>
        <span class="">CHEAP</span>
    </div>
</body>
</html>

<script>
    var isGood = document.getElementById("good");
    var isFast = document.getElementById("fast");
    var isCheap = document.getElementById("cheap");

    function HandleClick() {

        if (isGood.checked && isFast.checked && isCheap.checked) {
            if (this === isGood) {
                isCheap.checked = false;
            } else if (this === isFast) {
                isGood.checked = false;
            } else {
                isFast.checked = false;
            }
        }




    }

    isGood.addEventListener("click", HandleClick)
    isFast.addEventListener("click", HandleClick)
    isCheap.addEventListener("click", HandleClick);


</script>
