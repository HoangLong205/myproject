<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sở thích!</title>
  <style>
    body {
      background-color: #dffafa; /* Màu nền xanh nhạt */
      font-family: Arial, sans-serif;
    }

    form {
      width: 400px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      background: #ff6600;
      color: white;
      text-align: center;
      padding: 10px;
      margin: 20px auto;
      font-size: 18px;
    }

    p {
      font-weight: bold;
      color: #003366;
    }

    input[type="text"] {
      width: 100%;
      padding: 5px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    input[type="checkbox"] {
      margin-right: 5px;
    }

    label {
      display: inline-block;
      width: 45%;
      margin-bottom: 10px;
      color: #ff6600;
    }

    button {
      background: #e0e0e0;
      border: none;
      padding: 8px 12px;
      margin: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #ccc;
    }
  </style>
</head>
<body>
<div>
  <h2>SỞ THÍCH CỦA BẠN!</h2>

    <form action="">
      <p>Họ và tên <input type="text" id="name"> </p>
      <p>Email <input type="text" id="email"> </p>
      <div>
        <p>Sở thích</p>

        <div>
          <label><input type="checkbox" id="sport"> Thể thao</label>
          <label><input type="checkbox" id="music"> Âm nhạc</label>
          <label><input type="checkbox" id="web"> lướt web</label>
          <label><input type="checkbox" id="books"> Đọc sách</label>
          <label><input type="checkbox" id="game"> chơi game</label>
          <label><input type="checkbox" id="movie"> Điện ảnh</label>
          <label><input type="checkbox" id="travel"> Du lịch</label>
        </div>
      </div>

      <div>
        <button type="submit">Gửi thông tin</button>
        <button type="reset">Nhập lại</button>
      </div>
    </form>
</div>


</body>
</html>
